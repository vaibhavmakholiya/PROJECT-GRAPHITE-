<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanchay - Offline</title>
  <style>
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: #F3F9FF;
      color: #0B2540;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #C7E3FA;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 360px;
      box-shadow: 0 4px 16px rgba(11, 37, 64, 0.06);
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      border: 1px solid #C7E3FA;
      border-radius: 16px;
      padding: 8px;
      margin-bottom: 16px;
    }
    .logo {
      width: 56px;
      height: 56px;
      object-fit: contain;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 8px;
      color: #0B2540;
    }
    p {
      font-size: 14px;
      color: #4A6580;
      margin: 0 0 24px;
      line-height: 1.5;
    }
    button {
      background: #1D6DB5;
      color: #FFFFFF;
      border: none;
      min-height: 48px;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(29, 109, 181, 0.2);
      transition: background 0.15s ease;
    }
    button:hover {
      background: #17588F;
    }
    button:focus-visible {
      outline: 3px solid #9CCBF3;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">
      <img src="/logo.png" alt="Sanchay" class="logo">
    </div>
    <h1>You are currently offline</h1>
    <p>Sanchay saves your passbook and ledger locally. Once internet is restored, changes will automatically sync.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
